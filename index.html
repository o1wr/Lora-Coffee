<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمصة لورا | l’ORA roastery</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #d97706;
            --accent-hover: #b45309;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        /* Announcement Bar */
        .announcement {
            background-color: var(--accent);
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            background: #334155;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            left: -5px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.75rem;
        }

        /* Nav Categories */
        nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active, .nav-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .price-badge {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }

        .old-price {
            text-decoration: line-through;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .current-price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .add-btn:hover {
            background: var(--accent-hover);
        }

        /* Modal Auth / Cart */
        .modal {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #334155;
        }

        .modal-content h3 { margin-bottom: 15px; }

        .input-field {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        .close-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="announcement">توصيل سريع لجميع مناطق الكويت 🇰🇼 | عروض خاصة بمناسبة الافتتاح</div>

    <header>
        <div class="logo">محمصة لورا | l’ORA</div>
        <div class="cart-icon" onclick="openCart()">
            🛒 السلة <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="filterCategory('all', this)">الكل</button>
        <button class="nav-btn" onclick="filterCategory('specialty', this)">القهوة المختصة</button>
        <button class="nav-btn" onclick="filterCategory('bundles', this)">الباقات</button>
        <button class="nav-btn" onclick="filterCategory('machines', this)">ماكينات القهوة</button>
    </nav>

    <main class="products-grid" id="productsContainer"></main>

    <!-- Modal Cart & Checkout -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h3>إتمام الطلب</h3>
            <div id="cartItems"></div>
            <p style="margin: 10px 0;"><strong>المجموع: </strong><span id="cartTotal">0</span> د.ك</p>
            <hr style="border-color:#334155; margin:10px 0;">
            
            <input type="text" id="custName" class="input-field" placeholder="الاسم الكامل" required>
            <input type="tel" id="custPhone" class="input-field" placeholder="رقم الهاتف" required>
            <input type="text" id="custAddress" class="input-field" placeholder="العنوان التفصيلي (المنطقة، القطعة، الشارع)" required>
            
            <button class="add-btn" style="margin-top:10px;" onclick="handleCheckout()">تأكيد وإرسال الطلب</button>
            <button class="close-btn" onclick="closeCart()">إلغاء</button>
        </div>
    </div>

    <script>
        // WEBHOOK URL - استبدل هذا الرابط برابط الديسكورد الخاص بك
        const DISCORD_WEBHOOK_URL = "YOUR_DISCORD_WEBHOOK_URL_HERE";

        const products = [
            { id: 1, name: "محصول إثيوبيا همبيلا", category: "specialty", price: 4.5, oldPrice: 5.5, img: "https://via.placeholder.com/250x180" },
            { id: 2, name: "محصول كولومبيا وسيلة", category: "specialty", price: 5.0, oldPrice: 6.0, img: "https://via.placeholder.com/250x180" },
            { id: 3, name: "باقة التوفير الثلاثية", category: "bundles", price: 12.0, oldPrice: 15.0, img: "https://via.placeholder.com/250x180" },
            { id: 4, name: "ماكينة إسبريسو منزلي", category: "machines", price: 85.0, oldPrice: 95.0, img: "https://via.placeholder.com/250x180" }
        ];

        let cart = [];

        function renderProducts(items) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            items.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" alt="${p.name}">
                        <h4>${p.name}</h4>
                        <div class="price-badge">
                            <span class="current-price">${p.price.toFixed(3)} د.ك</span>
                            ${p.oldPrice ? `<span class="old-price">${p.oldPrice.toFixed(3)} د.ك</span>` : ''}
                        </div>
                        <button class="add-btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            document.getElementById('cartCount').innerText = cart.length;
        }

        function openCart() {
            if (cart.length === 0) return alert("السلة فارغة!");
            const itemsDiv = document.getElementById('cartItems');
            itemsDiv.innerHTML = '';
            let total = 0;
            cart.forEach(i => {
                total += i.price;
                itemsDiv.innerHTML += `<div>- ${i.name} : ${i.price.toFixed(3)} د.ك</div>`;
            });
            document.getElementById('cartTotal').innerText = total.toFixed(3);
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        async function handleCheckout() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            if (!name || !phone || !address) return alert("يرجى تعبئة كافة البيانات");

            const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
            let itemsText = cart.map(c => `- ${c.name} (${c.price} د.ك)`).join('\n');
            let totalSum = document.getElementById('cartTotal').innerText;

            const payload = {
                username: "LORA Store Bot",
                embeds: [{
                    title: `📦 طلب جديد #${orderId}`,
                    color: 14251782,
                    fields: [
                        { name: "👤 العميل", value: name, inline: true },
                        { name: "📞 الهاتف", value: phone, inline: true },
                        { name: "📍 العنوان", value: address },
                        { name: "🛒 المنتجات", value: itemsText },
                        { name: "💰 المجموع الكلي", value: `${totalSum} د.ك` }
                    ],
                    timestamp: new Date()
                }]
            };

            if (DISCORD_WEBHOOK_URL && DISCORD_WEBHOOK_URL !== "YOUR_DISCORD_WEBHOOK_URL_HERE") {
                try {
                    await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Error sending to Discord", e);
                }
            }

            alert("تم إرسال طلبك بنجاح!");
            cart = [];
            document.getElementById('cartCount').innerText = 0;
            closeCart();
        }

        // Run Init
        renderProducts(products);
    </script>
</body>
</html>
