<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمصة لورا | Lora Coffee</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f121d; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        input, button, select { padding: 12px; margin: 6px 0; border-radius: 6px; border: 1px solid #333; width: 100%; font-size: 14px; }
        input, select { background: #1a1e2e; color: #fff; }
        button { background: #2e7d32; color: #fff; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .card { background: #1a1e2e; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #2a2f45; }
        .admin-card { border: 2px solid #ffd700; background: #171a29; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #1a1e2e; padding: 15px 20px; border-radius: 10px; }
        .badge { background: #1f274a; padding: 5px 12px; border-radius: 20px; font-size: 14px; border: 1px solid #3d4775; }
    </style>
</head>
<body>

<div class="container">

    <!-- شريط الحالة العلوي -->
    <div class="top-bar">
        <h2 style="margin: 0; font-size: 20px;">☕ محمصة لورا - Lora Coffee</h2>
        <div>
            <span id="userStatusText" class="badge">غير مسجل</span>
            <span class="badge" style="margin-right: 5px;">🛒 السلة: <b id="cartCount">0</b></span>
        </div>
    </div>

    <!-- قسم تسجيل الدخول -->
    <div id="loginSection" class="card">
        <h3 style="margin-top: 0;">تسجيل الدخول</h3>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">
            (ادخل بـ admin@lora.com / admin123 للوحة التحكم، أو أي إيميل آخر للدخول كعميل)
        </p>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" value="naser.alsulaiti@icloud.com">
        <input type="password" id="loginPass" placeholder="كلمة المرور" value="123456">
        <button onclick="loginUser()">دخول</button>
    </div>

    <!-- لوحة تحكم الإدارة -->
    <div id="adminDashboardSection" class="card admin-card" style="display: none;">
        <h3 style="color: #ffd700; margin-top: 0;">👑 لوحة تحكم الإدارة (Admin Dashboard)</h3>
        <hr style="border-color: #333; margin-bottom: 15px;">
        
        <h4 style="margin: 10px 0;">إضافة / تعديل منتج:</h4>
        <input type="text" id="adminProdName" placeholder="اسم المنتج">
        <input type="number" id="adminProdPrice" step="0.001" placeholder="السعر (د.ك)">
        <input type="text" id="adminProdImg" placeholder="رابط صورة المنتج">
        <button onclick="addProductByAdmin()">حفظ المنتج للمتجر</button>

        <h4 style="margin: 20px 0 10px 0;">إضافة كود خصم جديد:</h4>
        <input type="text" id="adminCode" placeholder="كود الخصم (مثال: LORA20)">
        <input type="number" id="adminDiscount" placeholder="نسبة الخصم %">
        <button onclick="addPromoCodeByAdmin()" style="background: #e65100;">حفظ كود الخصم</button>
    </div>

    <!-- قسم المتجر والمنتجات -->
    <div id="storeSection" class="card" style="display: none;">
        <h3 style="margin-top: 0;">المنتجات المتاحة</h3>
        <div id="productsGrid" class="products-grid"></div>

        <hr style="border-color: #333; margin: 25px 0;">
        <button onclick="checkoutOrder()" style="background: #1f274a; padding: 15px; font-size: 16px;">إرسال الطلب إلى الديسكورد 🚀</button>
        <button onclick="logoutUser()" style="background: #c62828; margin-top: 10px;">تسجيل الخروج</button>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
